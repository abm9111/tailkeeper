name: Beta feedback

description: Optional public feedback using sanitized synthetic details only.
body:
  - type: markdown
    attributes:
      value: |
        **GitHub issues are public and your GitHub identity is visible.** This optional form is not enrollment consent or consent to a case study. See the [beta protocol](https://github.com/abm9111/tailkeeper/blob/main/docs/security/beta-protocol.md) and [known limits](https://github.com/abm9111/tailkeeper/blob/main/docs/security/known-limits.md).

        For a security vulnerability, do not describe it here; follow the [private reporting route](https://github.com/abm9111/tailkeeper/blob/main/SECURITY.md). Do not include raw packs, projections, configuration, logs, host or account identifiers, passwords, tokens, participant codes or consent records. Share only wholly synthetic details that you have reviewed for publication.
  - type: input
    id: version
    attributes:
      label: tailkeeper version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Coarse OS, architecture and installation variant
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Exercise phase
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and assistance needed
      description: Describe the outcome and whether you needed a hint, guidance or someone to perform a step. Use synthetic details only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction and expected versus observed behavior
      description: Give a wholly synthetic summary. Do not paste operational data or raw output.
    validations:
      required: true
  - type: checkboxes
    id: publication
    attributes:
      label: Public submission
      options:
        - label: I reviewed the preview and voluntarily publish only sanitized synthetic details.
          required: true
